server:
  port: 0

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:h2:mem:ledger_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: ledger-test-group
      auto-offset-reset: earliest
    admin:
      auto-create: false

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long-for-hs256

kafka:
  topics:
    expense-created: expense.created
    expense-created-dlt: expense.created.DLT
