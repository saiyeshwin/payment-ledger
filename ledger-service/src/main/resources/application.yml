server:
  port: 8083

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5434/ledger_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long-for-hs256

kafka:
  topics:
    expense-created: expense.created
    expense-created-dlt: expense.created.DLT

logging:
  level:
    com.paymentledger: DEBUG
