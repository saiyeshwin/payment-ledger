server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: expense-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/expenses/**
        - id: ledger-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ledger/**
        - id: reporting-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/reports/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
      default-filters:
        - name: RequestLogging

management:
  endpoints:
    web:
      exposure:
        include: health,info,routes

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.paymentledger: DEBUG
